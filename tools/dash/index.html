<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shiro lab</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0b0b0c;
  --sidebar: #101011;
  --panel: #141416;
  --panel-2: #19191c;
  --hover: #1d1d20;
  --active: #232327;
  --border: #242428;
  --border-2: #2e2e33;
  --text: #e6e6e9;
  --muted: #8d8d96;
  --faint: #5c5c64;
  --primary: #f2f2f4;
  --primary-fg: #0b0b0c;
  --accent: #8b7cf6;
  --accent-surface: #8b7cf61f;
  --ok: #4ade80;
  --warn: #fbbf24;
  --err: #f87171;
  --c1: #8b7cf6; --c2: #38bdf8; --c3: #4ade80; --c4: #fbbf24; --c5: #f472b6; --c6: #a3a3ad;
  --code: #0f0f11;
  --radius: 8px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2a2a2f; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
/* sidebar */
.sb { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.sb-head { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); }
.logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #8b7cf6, #38bdf8); display: grid; place-items: center; font: 700 11px var(--mono); color: #0b0b0c; }
.sb-title { font-weight: 600; letter-spacing: .2px; }
.sb-sub { color: var(--faint); font: 11px var(--mono); margin-left: auto; }
.sb-sec { padding: 14px 10px 4px; color: var(--faint); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; }
.nav { padding: 0 6px; display: flex; flex-direction: column; gap: 1px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 6px; color: var(--muted); }
.nav button:hover { background: var(--hover); color: var(--text); }
.nav button.on { background: var(--active); color: var(--text); }
.nav svg { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav .count { margin-left: auto; font: 11px var(--mono); color: var(--faint); }
.sb-list { padding: 0 6px; overflow: auto; flex: 1; min-height: 0; }
.sb-row { display: flex; align-items: center; gap: 8px; padding: 5px 9px; border-radius: 6px; color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.sb-row:hover { background: var(--hover); color: var(--text); }
.sb-row .t { overflow: hidden; text-overflow: ellipsis; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
.dot.live { background: var(--ok); box-shadow: 0 0 0 3px #4ade8022; animation: pulse 1.6s infinite; }
.dot.err { background: var(--err); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px #4ade8000; } }
.sb-foot { border-top: 1px solid var(--border); padding: 10px 14px; font: 11px var(--mono); color: var(--faint); display: flex; align-items: center; gap: 8px; }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.hdr { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.hdr h1 { font-size: 14px; font-weight: 600; margin: 0; }
.hdr .crumb { color: var(--faint); }
.hdr .sp { flex: 1; }
.page { overflow: auto; flex: 1; min-height: 0; padding: 20px; }
.page.flush { padding: 0; display: flex; }

.btn { cursor: pointer; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text); border-radius: 6px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.btn:hover { background: var(--hover); border-color: #3a3a40; }
.btn.pri { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); font-weight: 500; }
.btn.pri:hover { background: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.danger:hover { color: var(--err); border-color: #f8717155; }
.btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-2); color: var(--muted); font: 11px var(--mono); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font: 11px var(--mono); background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
.tag.cm { color: #38bdf8; } .tag.nn { color: #f472b6; } .tag.hybrid { color: #8b7cf6; background: var(--accent-surface); border-color: #8b7cf640; }

.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 500; }
.card-h .sub { color: var(--faint); font-weight: 400; font-size: 12px; }
.card-b { padding: 14px; }
.kpi { padding: 14px; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi .v { font: 600 22px/1.3 var(--mono); margin-top: 4px; letter-spacing: -.5px; }
.kpi .s { color: var(--faint); font-size: 12px; margin-top: 2px; }
.up { color: var(--err); } .down { color: var(--ok); }
.chart { position: relative; height: 260px; }
.mt { margin-top: 12px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 8px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 1; }
td { padding: 7px 12px; border-bottom: 1px solid #1c1c1f; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
tr.sel td { background: var(--active); }
td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12px; }
td.note { color: var(--muted); max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
td.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tbl-wrap { overflow: auto; max-height: calc(100vh - 220px); }

.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.inp { background: var(--code); border: 1px solid var(--border-2); border-radius: 6px; padding: 5px 9px; outline: none; min-width: 0; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-surface); }
select.inp { padding: 4px 8px; }
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 6px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border-2); }
.seg button.on { background: var(--active); color: var(--text); }

.empty { color: var(--faint); padding: 28px; text-align: center; }
.err-box { border: 1px solid #f8717140; background: #f871710f; color: #fca5a5; border-radius: var(--radius); padding: 10px 14px; font: 12px var(--mono); }

/* live */
.meter { height: 6px; border-radius: 6px; background: var(--panel-2); overflow: hidden; margin-top: 8px; }
.meter > div { height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s; }
.proc { display: grid; grid-template-columns: 64px 76px 60px 70px 1fr; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #1c1c1f; font: 12px var(--mono); align-items: center; }
.proc .a { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-row { display: grid; grid-template-columns: 14px 170px 70px 1fr; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #1c1c1f; cursor: pointer; }
.log-row:hover { background: var(--hover); }
.log-row.sel { background: var(--active); }
.log-row .n { font: 12px var(--mono); }
.log-row .age { color: var(--faint); font: 11px var(--mono); }
.log-row .last { color: var(--muted); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog { height: 3px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.prog > div { height: 100%; background: var(--ok); }
pre.term { margin: 0; background: var(--code); padding: 12px 14px; font: 12px/1.55 var(--mono); color: #c9c9d1; overflow: auto; max-height: 420px; white-space: pre-wrap; word-break: break-all; border-radius: 0 0 var(--radius) var(--radius); }

/* lab */
.lab-list { width: 270px; flex: none; border-right: 1px solid var(--border); overflow: auto; padding: 10px 8px; }
.lab-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; }
.lab-item:hover { background: var(--hover); }
.lab-item.on { background: var(--active); }
.lab-item .t { font-weight: 500; }
.lab-item .m { color: var(--faint); font: 11px var(--mono); margin-top: 2px; }
.lab-main { flex: 1; overflow: auto; padding: 20px; min-width: 0; }
.lab-title { all: unset; font-size: 18px; font-weight: 600; width: 100%; }
.tex-view { padding: 22px 18px; font-size: 17px; overflow-x: auto; text-align: center; min-height: 72px; }
.tex-err { color: var(--err); font: 12px var(--mono); }
textarea.code { width: 100%; resize: vertical; background: var(--code); border: 1px solid var(--border-2); border-radius: 6px; padding: 8px 10px; font: 12.5px/1.55 var(--mono); outline: none; color: #d7d7de; }
textarea.code:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-surface); }
.field-l { color: var(--muted); font-size: 12px; margin: 14px 0 6px; display: flex; align-items: center; gap: 8px; }
.field-l .hint { color: var(--faint); font-size: 11px; }
.expr-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.expr-row input { flex: 1; font-family: var(--mono); font-size: 12.5px; }
.params { display: grid; grid-template-columns: 1fr; gap: 6px; }
.param { display: grid; grid-template-columns: 70px 1fr 90px 64px 64px 26px; gap: 8px; align-items: center; }
.param .nm { font: 12px var(--mono); }
.param input[type=range] { width: 100%; accent-color: var(--accent); }
.param .inp { font: 11px var(--mono); padding: 3px 6px; }
.plot-wrap { position: relative; height: 340px; }
canvas.plot { width: 100%; height: 100%; display: block; cursor: crosshair; }
.readout { position: absolute; top: 8px; right: 10px; font: 11px var(--mono); color: var(--muted); background: #0b0b0cd0; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; pointer-events: none; white-space: pre; }
.row { display: flex; gap: 8px; align-items: center; }
.saved { color: var(--faint); font: 11px var(--mono); }

/* journal */
.note-body { line-height: 1.65; color: #d4d4da; }
.note-body p { margin: 0 0 10px; }
.note-body code { font: 12px var(--mono); background: var(--code); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }
.cheat { color: var(--faint); font: 11.5px/1.7 var(--mono); }
.cheat b { color: var(--muted); font-weight: 500; }
.regbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 10px; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font: 12px var(--mono); }
.kv .k { color: var(--faint); }
.hide { display: none !important; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-head"><div class="sb-title">shiro lab</div><div class="sb-sub" id="sb-rev"></div></div>
    <div class="sb-sec">Workspace</div>
    <nav class="nav" id="nav">
      <button data-v="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</button>
      <button data-v="runs"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Runs<span class="count" id="n-runs"></span></button>
      <button data-v="live"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Live<span class="count" id="n-live"></span></button>
      <button data-v="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7 15h10"/></svg>Formula lab<span class="count" id="n-lab"></span></button>
      <button data-v="journal"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Journal<span class="count" id="n-notes"></span></button>
    </nav>
    <div class="sb-sec">Running now</div>
    <div class="sb-list" id="sb-jobs"><div class="sb-row"><span class="t">…</span></div></div>
    <div class="sb-foot"><span class="dot" id="conn-dot"></span><span id="conn-txt">connecting</span></div>
  </aside>

  <main class="main">
    <div class="hdr"><span class="crumb">shiro /</span><h1 id="hdr-title">Overview</h1><div class="sp"></div><div id="hdr-actions" class="row"></div></div>

    <!-- overview -->
    <section class="page" id="v-overview">
      <div class="grid g4" id="kpis"></div>
      <div class="grid g2 mt">
        <div class="card"><div class="card-h">enwik8 <span class="sub">bytes, lower is better</span></div><div class="card-b"><div class="chart"><canvas id="ch-e8"></canvas></div></div></div>
        <div class="card"><div class="card-h">enwik7 <span class="sub">bytes, lower is better</span></div><div class="card-b"><div class="chart"><canvas id="ch-e7"></canvas></div></div></div>
      </div>
      <div class="grid g2 mt">
        <div class="card"><div class="card-h">Where the bytes go <span class="sub" id="reg-sub"></span></div><div class="card-b" id="regions"></div></div>
        <div class="card"><div class="card-h">Targets</div><div class="card-b" id="targets"></div></div>
      </div>
    </section>

    <!-- runs -->
    <section class="page hide" id="v-runs">
      <div class="toolbar">
        <input class="inp" id="f-q" placeholder="Filter note, rev, config…" style="width:260px">
        <div class="seg" id="f-kind"><button data-k="" class="on">All</button><button data-k="cm">CM</button><button data-k="nn">NN</button><button data-k="hybrid">Hybrid</button></div>
        <select class="inp" id="f-file"></select>
        <div class="sp" style="flex:1"></div>
        <span class="saved" id="runs-info"></span>
      </div>
      <div class="grid" style="grid-template-columns: minmax(0,1fr) 340px;">
        <div class="card"><div class="tbl-wrap"><table><thead><tr><th>When</th><th>Kind</th><th>File</th><th class="num">Bytes</th><th class="num">bpc</th><th class="num">Δ best</th><th class="num">Time</th><th>Rev</th><th>Note</th></tr></thead><tbody id="runs-body"></tbody></table></div></div>
        <div class="card" id="run-detail"><div class="empty">Select a run</div></div>
      </div>
    </section>

    <!-- live -->
    <section class="page hide" id="v-live">
      <div id="live-err"></div>
      <div class="grid g4" id="live-tiles"></div>
      <div class="card mt"><div class="card-h">Processes <span class="sub">shiro, nn/online, sweeps</span></div><div id="procs"></div></div>
      <div class="grid mt" style="grid-template-columns: 420px minmax(0,1fr);">
        <div class="card"><div class="card-h">Job logs</div><div id="logs"></div></div>
        <div class="card"><div class="card-h"><span id="log-name">Log</span><span class="sub" id="log-sub"></span><div class="sp" style="flex:1"></div><label class="saved row"><input type="checkbox" id="log-follow" checked> follow</label></div><pre class="term" id="log-text">Select a log</pre></div>
      </div>
    </section>

    <!-- lab -->
    <section class="page flush hide" id="v-lab">
      <div class="lab-list" id="lab-list"></div>
      <div class="lab-main" id="lab-main"></div>
    </section>

    <!-- journal -->
    <section class="page flush hide" id="v-journal">
      <div class="lab-list" id="note-list"></div>
      <div class="lab-main" id="note-main"></div>
    </section>
  </main>
</div>

<script>
"use strict";
// ---------------- utils ----------------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
const fmtB = n => n == null ? "–" : Math.round(n).toLocaleString("en-US");
const fmtMB = n => (n / 1e6).toFixed(3) + " MB";
const fmtDur = s => { s = Math.round(s); if (s < 60) return s + "s"; if (s < 3600) return Math.floor(s/60) + "m " + (s%60) + "s"; return Math.floor(s/3600) + "h " + Math.floor(s%3600/60) + "m"; };
const fmtAgo = s => s < 60 ? Math.round(s) + "s ago" : s < 3600 ? Math.round(s/60) + "m ago" : s < 86400 ? Math.round(s/3600) + "h ago" : Math.round(s/86400) + "d ago";
const fmtTs = t => { const d = new Date(t * 1000); return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) + " " + d.toTimeString().slice(0, 5); };
const fileName = f => (f || "").split("/").pop();
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map(css);
const KIND_COLOR = { cm: css("--c2"), nn: css("--c5"), hybrid: css("--c1") };
async function api(path, opt) { const r = await fetch(path, opt); return r.json(); }
function tex(el, src, display = true) {
  try { katex.render(src, el, { displayMode: display, throwOnError: true, strict: "ignore" }); return null; }
  catch (e) { el.textContent = ""; el.append(h("div", { class: "tex-err" }, e.message.replace(/^KaTeX parse error: /, ""))); return e; }
}
function mdLite(src) {
  // paragraphs, **bold**, `code`, $tex$ and $$tex$$
  const out = h("div", { class: "note-body" });
  for (const para of (src || "").split(/\n{2,}/)) {
    const p = h("p");
    const re = /(\$\$[^$]+\$\$|\$[^$\n]+\$|`[^`]+`|\*\*[^*]+\*\*)/g;
    let last = 0, m;
    while ((m = re.exec(para))) {
      if (m.index > last) p.append(para.slice(last, m.index));
      const t = m[0];
      if (t.startsWith("$$")) { const s = h("span"); tex(s, t.slice(2, -2), true); p.append(s); }
      else if (t.startsWith("$")) { const s = h("span"); tex(s, t.slice(1, -1), false); p.append(s); }
      else if (t.startsWith("`")) p.append(h("code", {}, t.slice(1, -1)));
      else p.append(h("b", {}, t.slice(2, -2)));
      last = m.index + t.length;
    }
    if (last < para.length) p.append(para.slice(last));
    p.innerHTML = p.innerHTML.replace(/\n/g, "<br>");
    out.append(p);
  }
  return out;
}

Chart.defaults.color = css("--muted");
Chart.defaults.borderColor = css("--border");
Chart.defaults.font.family = css("--font");
Chart.defaults.font.size = 11;

// ---------------- state + router ----------------
const S = { runs: [], status: null, lab: { formulas: [], notes: [] }, view: "overview", runSel: null, logSel: null, fSel: null, nSel: null, kind: "", file: "" };
const TITLES = { overview: "Overview", runs: "Runs", live: "Live", lab: "Formula lab", journal: "Journal" };
function show(v) {
  S.view = v;

  for (const v of ticks(y0, y1, 6)) { const y = Math.round(Y(v)) + .5; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke(); g.fillText(fmt(v), L - 8, y); }
  g.textAlign = "center"; g.textBaseline = "top";
  for (const v of ticks(x0, x1, 8)) { const x = Math.round(X(v)) + .5; g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke(); g.fillText(fmt(v), x, T + ph + 8); }
  g.strokeStyle = "#34343a";
  if (y0 < 0 && y1 > 0) { g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(L + pw, Y(0)); g.stroke(); }
  if (x0 < 0 && x1 > 0) { g.beginPath(); g.moveTo(X(0), T); g.lineTo(X(0), T + ph); g.stroke(); }
  // curves
  g.save(); g.beginPath(); g.rect(L, T, pw, ph); g.clip();
  series.forEach((ys, k) => {
    if (!ys) return;
    g.strokeStyle = COLORS[k % 6]; g.lineWidth = k === 0 ? 2.2 : 1.6; g.setLineDash(k === 0 ? [] : k === 1 ? [] : [5, 4]);
    g.beginPath(); let pen = false;
    ys.forEach((y, i) => { const x = x0 + (x1 - x0) * i / N; if (!isFinite(y)) { pen = false; return; } const py = Y(y); if (!pen) { g.moveTo(X(x), py); pen = true; } else g.lineTo(X(x), py); });
    g.stroke();
  });
  g.setLineDash([]);
  // minimum marker of curve 1
  if (series[0]) { let bi = -1; series[0].forEach((y, i) => { if (isFinite(y) && (bi < 0 || y < series[0][bi])) bi = i; }); if (bi > 0 && bi < N) { const x = x0 + (x1 - x0) * bi / N; g.fillStyle = COLORS[0]; g.beginPath(); g.arc(X(x), Y(series[0][bi]), 3.5, 0, 7); g.fill(); f._min = [x, series[0][bi]]; } else f._min = null; }
  // hover
  let read = null;
  if (hover && hover.x >= L && hover.x <= L + pw) {
    const x = x0 + (hover.x - L) / pw * (x1 - x0);
    g.strokeStyle = "#ffffff30"; g.beginPath(); g.moveTo(hover.x, T); g.lineTo(hover.x, T + ph); g.stroke();
    read = "x = " + fmt(x);
    fns.forEach((fn, k) => { if (!fn) return; let y; try { y = fn(x, pv); } catch (e) { y = NaN; } if (isFinite(y)) { g.fillStyle = COLORS[k % 6]; g.beginPath(); g.arc(hover.x, Y(y), 3, 0, 7); g.fill(); } read += `\n${["①","②","③","④","⑤","⑥"][k]} ${isFinite(y) ? fmt(y) : "—"}`; });
  }
  g.restore();
  return { errs, read };
}

// ---------------- lab: UI ----------------
let saveTimer = null;
function saveLab() {
  clearTimeout(saveTimer);
  const s = $("#lab-saved") || $("#note-saved"); if (s) s.textContent = "saving…";
  saveTimer = setTimeout(async () => {
    const clean = JSON.parse(JSON.stringify(S.lab, (k, v) => k.startsWith("_") ? undefined : v));
    const r = await api("/api/lab", { method: "PUT", headers: { "Content-Type": "application/json", "X-Lab": "1" }, body: JSON.stringify(clean) });
    const s2 = $("#lab-saved") || $("#note-saved"); if (s2) s2.textContent = r.ok ? "saved to tools/dash/lab.json" : "save failed: " + r.error;
  }, 500);
}
async function loadLab() {
  S.lab = await api("/api/lab");
  S.lab.formulas = S.lab.formulas || []; S.lab.notes = S.lab.notes || [];
  $("#n-lab").textContent = S.lab.formulas.length; $("#n-notes").textContent = S.lab.notes.length;
  let v = null; try { v = localStorage.getItem("shiro.formula"); } catch (e) {}
  S.fSel = S.lab.formulas.find(f => f.id === v) || S.lab.formulas[0] || null;
  S.nSel = S.lab.notes[S.lab.notes.length - 1] || null;
  render();
}
const uid = () => Math.random().toString(36).slice(2, 9);
function newFormula() {
  const f = { id: uid(), title: "Untitled formula", tag: "idea", tex: "f(x) = a\\,x^2", exprs: ["a*x*x"], x: [-2, 2], y: [], params: [{ name: "a", min: -2, max: 2, step: 0.01, value: 1 }], notes: "" };
  S.lab.formulas.push(f); S.fSel = f; $("#n-lab").textContent = S.lab.formulas.length; saveLab(); renderLab();
  setTimeout(() => { const t = $(".lab-title"); if (t) { t.focus(); t.select(); } }, 0);
}
function renderLabList() {
  const list = $("#lab-list"); list.textContent = "";
  const q = h("input", { class: "inp", placeholder: "Search formulas…", style: "width:100%;margin:0 0 8px", value: S.labQ || "", oninput: e => { S.labQ = e.target.value; renderLabList(); const i = $("#lab-list input"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
  list.append(q);
  const ql = (S.labQ || "").toLowerCase();
  const groups = {};
  for (const f of S.lab.formulas) if (!ql || (f.title + f.tag + f.tex + f.notes).toLowerCase().includes(ql)) (groups[f.tag || "other"] = groups[f.tag || "other"] || []).push(f);
  for (const [tag, fs] of Object.entries(groups)) {
    list.append(h("div", { class: "sb-sec", style: "padding:10px 10px 4px" }, tag));
    for (const f of fs) list.append(h("div", { class: "lab-item" + (S.fSel === f ? " on" : ""), onclick: () => { S.fSel = f; try { localStorage.setItem("shiro.formula", f.id); } catch (e) {} renderLab(); } },
      h("div", { class: "t" }, f.title), h("div", { class: "m" }, f.exprs.length + " curve" + (f.exprs.length > 1 ? "s" : "") + " · " + f.params.length + " param" + (f.params.length !== 1 ? "s" : ""))));
  }
}
function renderLab() {
  renderLabList();
  const m = $("#lab-main"); m.textContent = "";
  const f = S.fSel;
  if (!f) { m.append(h("div", { class: "empty" }, "No formulas yet. Make one with “New formula”.")); return; }
  let hover = null;
  const cv = h("canvas", { class: "plot" });
  const readout = h("div", { class: "readout hide" });
  const exprErr = h("div", { class: "tex-err" });
  const minInfo = h("span", { class: "saved" });
  const redraw = () => {
    const r = drawPlot(cv, f, hover);
    exprErr.textContent = r.errs.join("  ·  ");
    readout.classList.toggle("hide", !r.read); readout.textContent = r.read || "";
    minInfo.textContent = f._min ? `min of ① at x = ${(+f._min[0].toPrecision(4))}, y = ${(+f._min[1].toPrecision(5))}` : "";
  };
  cv.addEventListener("mousemove", e => { const b = cv.getBoundingClientRect(); hover = { x: e.clientX - b.left, y: e.clientY - b.top }; redraw(); });
  cv.addEventListener("mouseleave", () => { hover = null; redraw(); });
  const changed = (redrawToo = true) => { saveLab(); if (redrawToo) redraw(); };

  // header
  m.append(h("div", { class: "row", style: "margin-bottom:12px" },
    h("input", { class: "lab-title", value: f.title, oninput: e => { f.title = e.target.value; changed(false); renderLabList(); } }),
    h("input", { class: "inp", value: f.tag || "", placeholder: "tag", style: "width:110px;font:12px var(--mono)", title: "group", oninput: e => { f.tag = e.target.value; changed(false); renderLabList(); } }),
    h("button", { class: "btn ghost", title: "Duplicate", onclick: () => { const c = JSON.parse(JSON.stringify(f)); c.id = uid(); c.title += " (copy)"; S.lab.formulas.push(c); S.fSel = c; changed(false); renderLab(); } }, icon("copy")),
    h("button", { class: "btn ghost danger", title: "Delete", onclick: () => { if (!confirm(`Delete “${f.title}”?`)) return; S.lab.formulas = S.lab.formulas.filter(x => x !== f); S.fSel = S.lab.formulas[0] || null; $("#n-lab").textContent = S.lab.formulas.length; changed(false); renderLab(); } }, icon("trash"))));

  // TeX
  const texView = h("div", { class: "tex-view" });
  const texIn = h("textarea", { class: "code", rows: 2, spellcheck: "false", oninput: e => { f.tex = e.target.value; tex(texView, f.tex); changed(false); } });
  texIn.value = f.tex;
  tex(texView, f.tex);
  m.append(h("div", { class: "card" }, texView));
  m.append(h("div", { class: "field-l" }, "LaTeX", h("span", { class: "hint" }, "rendered live with KaTeX")), texIn);

  // plot
  m.append(h("div", { class: "card mt" }, h("div", { class: "card-b", style: "padding:10px" }, h("div", { class: "plot-wrap" }, cv, readout))));
  m.append(h("div", { class: "row", style: "margin-top:6px" }, minInfo, h("span", { style: "flex:1" }), exprErr));

  // expressions
  const exBox = h("div");
  const renderEx = () => {
    exBox.textContent = "";
    f.exprs.forEach((e, i) => {
      const inp = h("input", { class: "inp", value: e, spellcheck: "false", oninput: ev => { f.exprs[i] = ev.target.value; changed(); } });
      exBox.append(h("div", { class: "expr-row" }, h("span", { class: "swatch", style: `background:${COLORS[i % 6]}` }), inp,
        h("button", { class: "btn ghost", title: "Remove curve", onclick: () => { f.exprs.splice(i, 1); renderEx(); changed(); } }, icon("x"))));
    });
    exBox.append(h("button", { class: "btn", onclick: () => { f.exprs.push(""); renderEx(); changed(false); } }, icon("plus"), "Curve"));
  };
  renderEx();
  m.append(h("div", { class: "field-l" }, "Curves  y = f(x, params)", h("span", { class: "hint" }, "JavaScript expressions · helpers below")), exBox);

  // range
  const num = (v, set) => h("input", { class: "inp", value: v == null ? "" : v, style: "width:90px;font:12px var(--mono)", oninput: e => { set(e.target.value); changed(); } });
  m.append(h("div", { class: "field-l" }, "Axes"), h("div", { class: "row" },
    h("span", { class: "saved" }, "x from"), num(f.x[0], v => f.x[0] = +v), h("span", { class: "saved" }, "to"), num(f.x[1], v => f.x[1] = +v),
    h("span", { class: "saved", style: "margin-left:16px" }, "y from"), num(f.y && f.y[0], v => { f.y = f.y || []; f.y[0] = v === "" ? undefined : +v; if (v === "") f.y = []; }),
    h("span", { class: "saved" }, "to"), num(f.y && f.y[1], v => { f.y = f.y || []; f.y[1] = v === "" ? undefined : +v; if (v === "") f.y = []; }),
    h("span", { class: "saved" }, "(empty y = auto)")));

  // params
  const pBox = h("div", { class: "params" });
  const renderParams = () => {
    pBox.textContent = "";
    f.params.forEach((p, i) => {
      const val = h("span", { class: "nm", style: "text-align:right;color:var(--text)" }, fmtP(p.value));
      const sl = h("input", { type: "range", min: p.min, max: p.max, step: p.step || "any", value: p.value, oninput: e => { p.value = +e.target.value; val.textContent = fmtP(p.value); changed(); } });
      const mini = (k, w) => h("input", { class: "inp", value: p[k], title: k, oninput: e => { const v = k === "name" ? e.target.value : +e.target.value; p[k] = v; if (k !== "name") { sl.min = p.min; sl.max = p.max; sl.step = p.step || "any"; } changed(); } });
      pBox.append(h("div", { class: "param" }, mini("name"), sl, val, mini("min"), mini("max"),
        h("button", { class: "btn ghost", title: "Remove", onclick: () => { f.params.splice(i, 1); renderParams(); changed(); } }, icon("x"))));
    });
    pBox.append(h("div", {}, h("button", { class: "btn", onclick: () => { const used = new Set(f.params.map(p => p.name)); const nm = "abcdkmnrstuvw".split("").find(c => !used.has(c)) || "p" + f.params.length; f.params.push({ name: nm, min: 0, max: 1, step: 0.01, value: 0.5 }); renderParams(); changed(); } }, icon("plus"), "Parameter")));
  };
  const fmtP = v => Math.abs(v) >= 1e5 ? (+v).toExponential(2) : +(+v).toPrecision(5) + "";
  renderParams();
  m.append(h("div", { class: "field-l" }, "Parameters", h("span", { class: "hint" }, "name · slider · value · min · max")), pBox);

  // notes
  const nv = h("div", { style: "margin-top:8px" });
  const ni = h("textarea", { class: "code", rows: 5, placeholder: "Why this matters, what to try, what it predicts… ($tex$, **bold**, `code` work)", oninput: e => { f.notes = e.target.value; nv.textContent = ""; nv.append(mdLite(f.notes)); changed(false); } });
  ni.value = f.notes || "";
  nv.append(mdLite(f.notes));
  m.append(h("div", { class: "field-l" }, "Notes"), ni, nv);

  m.append(h("div", { class: "cheat card mt card-b" },
    h("div", {}, h("b", {}, "helpers  "), "sq(x) σ · st(p) logit · log2 ln exp sqrt pow abs min max clamp(x,a,b) · H(q) binary entropy · CE(q,p) cross-entropy bits · KL(q,p) · sum(a,b,i=>…) · PI E"),
    h("div", {}, h("b", {}, "tips  "), "params are plain variables in every curve · curve ① gets a minimum marker · hover the plot to read values · everything autosaves")));
  m.append(h("div", { class: "saved", id: "lab-saved", style: "margin-top:10px" }, ""));

  requestAnimationFrame(redraw);
  new ResizeObserver(redraw).observe(cv);
}

// ---------------- journal ----------------
function newNote() {
  const n = { id: uid(), ts: Math.floor(Date.now() / 1000), title: "New note", body: "" };
  S.lab.notes.push(n); S.nSel = n; $("#n-notes").textContent = S.lab.notes.length; saveLab(); renderJournal();
  setTimeout(() => { const t = $("#note-main .lab-title"); if (t) { t.focus(); t.select(); } }, 0);
}
function renderJournal() {
  const list = $("#note-list"); list.textContent = "";
  for (const n of S.lab.notes.slice().sort((a, b) => b.ts - a.ts)) list.append(h("div", { class: "lab-item" + (S.nSel === n ? " on" : ""), onclick: () => { S.nSel = n; renderJournal(); } },
    h("div", { class: "t" }, n.title), h("div", { class: "m" }, fmtTs(n.ts))));
  const m = $("#note-main"); m.textContent = "";
  const n = S.nSel;
  if (!n) { m.append(h("div", { class: "empty" }, "No notes yet")); return; }
  const view = h("div", { class: "card card-b mt" });
  view.append(mdLite(n.body));
  const body = h("textarea", { class: "code", rows: 12, placeholder: "What did we try, what happened, why… ($tex$ works)", oninput: e => { n.body = e.target.value; view.textContent = ""; view.append(mdLite(n.body)); saveLab(); } });
  body.value = n.body;
  m.append(h("div", { class: "row", style: "margin-bottom:12px" },
    h("input", { class: "lab-title", value: n.title, oninput: e => { n.title = e.target.value; saveLab(); $$("#note-list .lab-item.on .t").forEach(t => t.textContent = n.title); } }),
    h("span", { class: "saved" }, fmtTs(n.ts)),
    h("button", { class: "btn ghost danger", title: "Delete", onclick: () => { if (!confirm(`Delete “${n.title}”?`)) return; S.lab.notes = S.lab.notes.filter(x => x !== n); S.nSel = S.lab.notes[0] || null; $("#n-notes").textContent = S.lab.notes.length; saveLab(); renderJournal(); } }, icon("trash"))),
    body, view, h("div", { class: "saved", id: "note-saved", style: "margin-top:10px" }, ""));
}

// ---------------- boot ----------------
let v0 = "overview"; try { v0 = localStorage.getItem("shiro.view") || "overview"; } catch (e) {}
show(TITLES[v0] ? v0 : "overview");
loadRuns(false);
loadLab();
loadStatus();
setInterval(loadStatus, 5000);
setInterval(() => { if (S.view === "live" && S.logSel && $("#log-follow").checked) loadLog(); }, 5000);
setInterval(() => loadRuns(false), 60000);
</script>
