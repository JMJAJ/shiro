# cmx = the cmix-lineage engine in cmx/ (ex-girlfriend 2.0, GPL-3; see cmx/NOTICE.md).
#
#   mode=stream  build the research binary, run -e on enwik9 with the coder stopped at
#                once, and cache the finished coder stream (archive.cmix.temp, ~500 MB).
#   mode=screen  for each line of `runs` ("<ref> [ENV=VAL ...]"), code the first `mb` MB
#                of that cached stream with `-n` and report the coded size. First line =
#                baseline. Up to 20 runners in parallel.
#
# The research build is the release tree with PORT_ENTRY 0 / PORT_CMX_MEAS 1, so CMX_*
# knobs are read from the environment. The 2.0 recipe is
#   CMX_SEMKEYS=R,12 CMX_FW_BLOCKS=4 BITL_SEQ=0
# (no knobs = cmix-neif 2.0 defaults).
name: cmx

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stream | screen"
        default: screen
      runs:
        description: "screen: runs separated by newlines or ';', each <ref> [ENV=VAL ...]"
        default: "cmx"
      mb:
        description: "screen: MB of the coder stream to code"
        default: "12"
      label:
        description: "free text for the summary"
        default: ""

run-name: "cmx ${{ inputs.mode }} ${{ inputs.mb }}MB ${{ inputs.label }}"

env:
  STREAM_KEY: cmxstream-v1

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          RUNS: ${{ inputs.mode == 'stream' && 'cmx' || inputs.runs }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          rows = []
          for line in (l.strip() for l in os.environ["RUNS"].replace(";", "\n").splitlines()):
              if line:
                  ref, _, env = line.partition(" ")
                  rows.append({"i": len(rows), "ref": ref, "env": " ".join(env.split())})
          assert 1 <= len(rows) <= 40
          print("matrix=" + json.dumps({"include": rows}))
          EOF

  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    name: "${{ matrix.i }} ${{ matrix.ref }} ${{ matrix.env }}"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: x
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-18 lld-18 llvm-18 libclang-rt-18-dev gawk zstd >/dev/null
          clang++-18 --version | head -1
      - name: Build cache
        id: bc
        uses: actions/cache@v4
        with:
          path: bin
          key: cmxbin-${{ hashFiles('x/cmx/**') }}
      - name: Build research binary
        if: steps.bc.outputs.cache-hit != 'true'
        run: |
          cd x/cmx
          sed -i 's/^#define PORT_ENTRY 1 /#define PORT_ENTRY 0 /; s/^#define PORT_CMX_MEAS 0 /#define PORT_CMX_MEAS 1 /' src/port_cfg.h
          grep -n '^#define PORT_' src/port_cfg.h
          # the GCC-14 pitfall from docs/BUILD.md: pin clang to GCC 13's headers
          if [ -d /usr/lib/gcc/x86_64-linux-gnu/14 ] && [ ! -d /usr/include/c++/14 ]; then
            for t in clang-18 clang++-18; do
              printf '#!/bin/sh\nexec /usr/bin/%s.real --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13 "$@"\n' "$t" | sudo tee /usr/local/bin/$t >/dev/null
              sudo ln -sf "$(readlink -f /usr/bin/$t)" /usr/bin/$t.real; sudo chmod +x /usr/local/bin/$t
            done
          fi
          mkdir -p ../../bin && cd ../../bin
          /usr/bin/time -v bash ../x/cmx/build.sh 2>&1 | tail -40
          cp ../x/cmx/weights-*.c? .
          ls -la
      - name: enwik9
        if: inputs.mode == 'stream'
        uses: actions/cache/restore@v4
        with:
          path: data/enwik9
          key: enwik9-v1
          fail-on-cache-miss: true
      - name: Make coder stream
        if: inputs.mode == 'stream'
        run: |
          mkdir -p r out && cd r
          cp ../bin/comp9 ../bin/weights-*.c? .
          ln -s ../data/enwik9 enwik9
          left=$(( JOB_START + 345*60 - $(date +%s) ))
          XZ_KEEP_TEMP=1 CMX_STOP_AT=100000 timeout "$left" /usr/bin/time -v ./comp9 -e enwik9 a9 2>&1 | tr '\r' '\n' | grep -v '^ *$' | tail -60 | tee ../out/stream.log
          ls -la
          test -s a9.cmix.temp
          sha256sum a9.cmix.temp | tee ../out/stream.sha256
          mkdir -p ../stream && zstd -q -T0 -10 a9.cmix.temp -o ../stream/stream.zst
          ls -la ../stream
      - name: Save stream
        if: inputs.mode == 'stream'
        uses: actions/cache/save@v4
        with:
          path: stream
          key: ${{ env.STREAM_KEY }}
      - name: Restore stream
        if: inputs.mode == 'screen'
        uses: actions/cache/restore@v4
        with:
          path: stream
          key: ${{ env.STREAM_KEY }}
          fail-on-cache-miss: true
      - name: Screen
        if: inputs.mode == 'screen'
        run: |
          mkdir -p r out && cd r
          cp ../bin/comp9 ../bin/weights-*.c? .
          zstd -dc ../stream/stream.zst | head -c $(( ${{ inputs.mb }} * 1000000 )) > s
          left=$(( JOB_START + 345*60 - $(date +%s) ))
          set +e
          env ${{ matrix.env }} timeout "$left" /usr/bin/time -v ./comp9 -n s o > ../out/log.txt 2>&1
          code=$?
          set -e
          tr '\r' '\n' < ../out/log.txt | grep -v '^ *$' | tail -25
          python3 - "$code" <<'EOF'
          import json, os, re, sys
          log = open("../out/log.txt", errors="replace").read()
          m = re.search(r"(\d+) bytes -> (\d+) bytes in ([\d.]+) s", log)
          rss = re.search(r"Maximum resident set size \(kbytes\): (\d+)", log)
          r = {"i": ${{ matrix.i }}, "ref": "${{ matrix.ref }}", "env": "${{ matrix.env }}", "mb": ${{ inputs.mb }},
               "exit": int(sys.argv[1]), "in": int(m.group(1)) if m else 0, "out": int(m.group(2)) if m else 0,
               "secs": float(m.group(3)) if m else 0.0, "rss_mb": int(rss.group(1)) // 1024 if rss else 0,
               "rev": os.popen("git -C ../x rev-parse --short HEAD").read().strip(),
               "cpu": open("/proc/cpuinfo").read().split("model name")[1].split(":")[1].split("\n")[0].strip()}
          open("../out/run.jsonl", "w").write(json.dumps(r) + "\n")
          print(r)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ matrix.i }}
          path: out/
          retention-days: 30

  summary:
    needs: run
    if: always() && inputs.mode == 'screen'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: run-*
          path: runs
      - run: |
          cat runs/*/run.jsonl > all.jsonl 2>/dev/null || true
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY" > table.md
          import json
          rs = sorted((json.loads(l) for l in open("all.jsonl") if l.strip()), key=lambda r: r["i"])
          base = next((r["out"] for r in rs if r["i"] == 0 and r["out"]), None)
          print("### cmx screen ${{ inputs.mb }} MB ${{ inputs.label }}\n")
          print("| # | ref | env | bytes | vs #0 | s | RSS MB | exit | rev |")
          print("|---|---|---|---|---|---|---|---|---|")
          for r in sorted(rs, key=lambda r: (r["out"] == 0, r["out"])):
              d = f"{(r['out'] - base):+,} ({(r['out'] - base) * 100 / base:+.3f}%)" if base and r["out"] else ""
              print(f"| {r['i']} | {r['ref']} | `{r['env']}` | {r['out']:,} | {d} | {r['secs']:.0f} | {r['rss_mb']} | {r['exit']} | {r['rev']} |")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            all.jsonl
            table.md
